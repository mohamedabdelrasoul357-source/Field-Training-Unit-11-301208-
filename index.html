
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taste & Co.</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- Food Gallery Section -->
    <section class="gallery-section" id="gallery">

        <div class="gallery-heading">
            <h2>Food Gallery</h2>
            <p>Discover our delicious meals</p>
        </div>

        <div class="gallery-container">

            <div class="gallery-item">
                <img class="gallery-img"
                src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=700"
                alt="Healthy Salad">
            </div>

            <div class="gallery-item">
                <img class="gallery-img"
                src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?w=700"
                alt="Fresh Food">
            </div>

            <div class="gallery-item">
                <img class="gallery-img"
                src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=700"
                alt="Delicious Pizza">
            </div>

            <div class="gallery-item">
                <img class="gallery-img"
                src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=700"
                alt="Grilled Food">
            </div>

        </div>

    </section>

    <!-- Lightbox -->
    <div id="lightbox-modal" class="lightbox-modal">

        <span id="lightbox-close" class="lightbox-close">
            &times;
        </span>

        <img id="lightbox-img" src="" alt="Selected Food">

    </div>

    



    <script type="module" src="./js/main.js"></script>
</body>
</html>
