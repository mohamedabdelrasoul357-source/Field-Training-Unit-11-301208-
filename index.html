<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
        <link rel="https://fontawesome.com/icons/sharp/solid/heart">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"&gt>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header id="home">
        <nav class="navbar">
            <ul class="nav-links" id="nav">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#gallerry">Gallerry</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <button class="menu-toggle" aria-label="Toggle-navigation" id="toggle">
                <i class="fa-solid fa-bars"></i>
            </button>
        </nav>
        <div class="hero-content">
            <h1 class="logo">welcome to <span>foodie</span> restourant</h1>
            <p>Enjoy delicious and unforggetable moments</p>
            <a href="#menu" class="btn">Explre menu</a>
        </div>
    </header>  
    <section id="menu">
    <h2>Special Menu</h2>

    <div class="filter-buttons">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="breakfast">Breakfast</button>
        <button class="filter-btn" data-category="lunch">Lunch</button>
        <button class="filter-btn" data-category="drinks">Drinks</button>
    </div>

    <div class="menu-container">
        <div class="menu-item" data-category="breakfast">
            <img src="./assets/images/avocado.jpg" alt="Avocado Toast">
            <h3>Avocado Toast</h3>
            <p>Popular</p>
            <span>$8.50</span>
        </div>

        <div class="menu-item" data-category="lunch">
            <img src="./assets/images/chicken.jpg" alt="Grilled Chicken Bowl">
            <h3>Grilled Chicken Bowl</h3>
            <p>Chef Choice</p>
            <span>$13.00</span>
        </div>

        <div class="menu-item" data-category="breakfast">
            <img src="./assets/images/pancakes.jpg" alt="Classic Pancakes">
            <h3>Classic Pancakes</h3>
            <p>New</p>
            <span>$7.00</span>
        </div>

        <div class="menu-item" data-category="drinks">
            <img src="./assets/images/orange.jpg" alt="Orange Juice">
            <h3>Fresh Orange Juice</h3>
            <p>Fresh</p>
            <span>$5.00</span>
        </div>
    </div>
</section>




<script src="./js/main.js"></script>
</body>
</html>
