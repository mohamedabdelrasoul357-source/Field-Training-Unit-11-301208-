<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <section id="menu">
    <h2>Special Menu</h2>

    <div class="filter-buttons">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="breakfast">Breakfast</button>
        <button class="filter-btn" data-category="lunch">Lunch</button>
        <button class="filter-btn" data-category="drinks">Drinks</button>
    </div>

    <div class="menu-container">
        <div class="menu-item" data-category="breakfast">
            <img src="./assets/images/avocado.jpg" alt="Avocado Toast">
            <h3>Avocado Toast</h3>
            <p>Popular</p>
            <span>$8.50</span>
        </div>

        <div class="menu-item" data-category="lunch">
            <img src="./assets/images/chicken.jpg" alt="Grilled Chicken Bowl">
            <h3>Grilled Chicken Bowl</h3>
            <p>Chef Choice</p>
            <span>$13.00</span>
        </div>

        <div class="menu-item" data-category="breakfast">
            <img src="./assets/images/pancakes.jpg" alt="Classic Pancakes">
            <h3>Classic Pancakes</h3>
            <p>New</p>
            <span>$7.00</span>
        </div>

        <div class="menu-item" data-category="drinks">
            <img src="./assets/images/orange.jpg" alt="Orange Juice">
            <h3>Fresh Orange Juice</h3>
            <p>Fresh</p>
            <span>$5.00</span>
        </div>
    </div>
</section>
    








    <script type="module" src="./js/main.js"></script>
</body>
</html>
